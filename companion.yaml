substitutions:
  name: stolni-kamarad
  friendly_name: Stolní kamarád
  alternate_wake_model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_jarvis.json
  alternate_wake_phrase: Hey Jarvis

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: deskbuddy.amoled175
    version: 0.2.7
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(buddy).init_ui(id(small_font),id(clock_font),id(date_font),id(control_font));
          id(ble_identity_0).publish_state(id(buddy).identities[0]);
          id(ble_identity_1).publish_state(id(buddy).identities[1]);
          id(ble_identity_2).publish_state(id(buddy).identities[2]);
          id(ble_identity_3).publish_state(id(buddy).identities[3]);
      - media_player.volume_set:
          id: voice_player
          volume: !lambda return id(speaker_volume).state/100.f;
      - script.execute: refresh_voice

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

preferences:
  flash_write_interval: 30s

external_components:
  - source:
      type: local
      path: components
    components: [desk_buddy]

packages:
  hardware: !include hardware.yaml
  controls: !include controls.yaml
  voice: !include voice.yaml
  presence: !include presence.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: Kamarad-Nastaveni
    password: !secret ap_password
    ap_timeout: 60s

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  id: mqtt_bus
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: deskbuddy/${name}
  discovery: true
  discovery_prefix: homeassistant
  discovery_retain: true
  reboot_timeout: 0s
  log_topic: null

web_server:
  port: 80
  version: 3
  local: true
  auth:
    type: digest
    username: !secret web_user
    password: !secret web_password

time:
  - platform: sntp
    id: internet_time
    # The runtime timezone selector owns libc TZ. Disable ESPHome's fixed
    # localtime override so localtime and mktime use the same selected zone.
    timezone: ""
    servers: [0.pool.ntp.org, 1.pool.ntp.org, 2.pool.ntp.org]
    on_time_sync:
      - lambda: id(buddy).invalidate();
      - component.update: sunrise_text
      - component.update: sunset_text

desk_buddy:
  id: buddy
  i2c_id: board_i2c

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(panel).set_brightness(uint8_t(id(buddy).brightness()*2.55f));
          id(buddy).mic_on=id(microphone_enabled).state;
          id(buddy).speaker_on=id(speaker_enabled).state;
          id(buddy).volume=id(speaker_volume).state;
  - interval: 30s
    then:
      - script.execute: refresh_voice

button:
  - platform: restart
    name: Restart
    id: restart_device
  - platform: template
    name: Vypnout napájení
    id: power_off
    on_press:
      - lambda: id(buddy).power_off();
  - platform: template
    name: Probudit displej
    id: wake_display
    on_press:
      - switch.turn_on: display_enabled
      - lambda: id(buddy).interact();
  - platform: template
    name: Zahájit rozhovor
    id: start_conversation
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: microphone_enabled
              - voice_assistant.connected:
              - not:
                  script.is_running: cancel_voice
              - not:
                  voice_assistant.is_running:
          then:
            - micro_wake_word.stop:
            - voice_assistant.start:

text_sensor:
  - platform: template
    name: Web nastavení sítě
    lambda: |-
      char ip[40];
      return std::string("http://") + wifi::global_wifi_component->get_ip_addresses()[0].str_to(ip) + "/setup";
    update_interval: 60s
  - platform: template
    name: Denní režim
    lambda: return id(buddy).phase_name();
    update_interval: 10s
  - platform: template
    name: Východ slunce
    id: sunrise_text
    lambda: return id(buddy).sun_text(true);
    update_interval: 60s
  - platform: template
    name: Západ slunce
    id: sunset_text
    lambda: return id(buddy).sun_text(false);
    update_interval: 60s
  - platform: template
    name: Stav hlasu
    id: voice_status
    lambda: return id(buddy).status;
    update_interval: 2s
