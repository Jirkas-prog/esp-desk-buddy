binary_sensor:
  - platform: template
    name: BLE 1 poblíž
    id: ble_near_0
    device_class: presence
    lambda: return id(buddy).presence[0].near;
  - platform: template
    name: BLE 2 poblíž
    id: ble_near_1
    device_class: presence
    lambda: return id(buddy).presence[1].near;
  - platform: template
    name: BLE 3 poblíž
    id: ble_near_2
    device_class: presence
    lambda: return id(buddy).presence[2].near;
  - platform: template
    name: BLE 4 poblíž
    id: ble_near_3
    device_class: presence
    lambda: return id(buddy).presence[3].near;

sensor:
  - platform: template
    name: BLE 1 signál
    unit_of_measurement: dBm
    device_class: signal_strength
    update_interval: 5s
    lambda: return id(buddy).presence[0].seen?id(buddy).presence[0].rssi:NAN;
  - platform: template
    name: BLE 2 signál
    unit_of_measurement: dBm
    device_class: signal_strength
    update_interval: 5s
    lambda: return id(buddy).presence[1].seen?id(buddy).presence[1].rssi:NAN;
  - platform: template
    name: BLE 3 signál
