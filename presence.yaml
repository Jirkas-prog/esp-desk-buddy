esp32_ble_tracker:
  id: ble_scanner
  scan_parameters:
    active: false
    interval: 320ms
    window: 30ms
    duration: 30s
    continuous: false
  on_ble_advertise:
    - lambda: |-
        char mac[18],uuid[37];
        auto beacon=x.get_ibeacon();
        id(buddy).observe(x.address_str_to(mac),beacon.has_value()?beacon->get_uuid().to_str(uuid):"",x.get_rssi());

switch:
  - platform: template
    id: ble_enabled
    name: BLE vyhledávání
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(buddy).ble_on=true;
      - script.execute: refresh_voice
    turn_off_action:
      - lambda: |-
          id(buddy).ble_on=false;
          for(auto &p:id(buddy).presence) p={};
      - esp32_ble_tracker.stop_scan:

text:
  - platform: template
    name: BLE 1 adresa nebo iBeacon UUID
    id: ble_identity_0
    mode: text
    min_length: 0
    max_length: 36
    initial_value: ""
    restore_value: false
    set_action:
      - lambda: |-
          if(buddy_logic::valid_identity(x)) id(ble_identity_0).publish_state(x);
          else ESP_LOGW("buddy", "BLE: expected MAC or UUID");
    on_value:
      - lambda: id(buddy).set_identity(0,x);
