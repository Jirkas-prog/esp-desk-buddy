    update_interval: 5s
    lambda: return id(buddy).presence[3].seen?id(buddy).presence[3].rssi:NAN;

text_sensor:
  - platform: template
    name: Poslední BLE zařízení
    lambda: return id(buddy).nearby;
    update_interval: 10s
